name: Release

# Push a tag like v0.1.0 to build desktop packages and publish a GitHub Release.
# The release assets are named so the built-in Wails updater can find them:
#   - wails-v3-demo-darwin-arm64-amd64.zip   (universal .app)
#   - wails-v3-demo-windows-amd64.zip        (portable .exe)
#   - wails-v3-demo-linux-amd64.tar.gz       (standalone binary)
# Installers are uploaded too, but their names deliberately omit the platform
# token so the updater does not mistake them for update payloads.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v3.0.0-alpha2.108

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-14
            artifact: darwin
          - name: Windows amd64
            os: windows-latest
            artifact: windows
          - name: Linux amd64
            os: ubuntu-latest
            artifact: linux
    steps:
      - uses: actions/checkout@v4

      - name: Verify build assets are committed
        shell: bash
        run: |
          if [ ! -f build/Taskfile.yml ]; then
            echo "::error::build/ is missing. Commit the Wails build assets before tagging."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tags must look like v1.2.3 (got ${GITHUB_REF_NAME})"
            exit 1
          fi

          sedi() {
            if sed --version >/dev/null 2>&1; then
              sed -i -E "$@"
            else
              sed -i '' -E "$@"
            fi
          }

          sedi "s/^var Version = \".*\"$/var Version = \"${VERSION}\"/" main.go
          sedi "s/^(  version: )\"[^\"]*\"/\1\"${VERSION}\"/" build/config.yml
          sedi "/<key>CFBundleVersion<\/key>/{n;s#<string>[^<]*</string>#<string>${VERSION}</string>#;}" build/darwin/Info.plist
          sedi "/<key>CFBundleShortVersionString<\/key>/{n;s#<string>[^<]*</string>#<string>${VERSION}</string>#;}" build/darwin/Info.plist
          sedi "s/(\"file_version\": \")[^\"]*\"/\1${VERSION}\"/" build/windows/info.json
          sedi "s/(\"ProductVersion\": \")[^\"]*\"/\1${VERSION}\"/" build/windows/info.json
          sedi "s/(!define INFO_PRODUCTVERSION \")[^\"]*\"/\1${VERSION}\"/" build/windows/nsis/wails_tools.nsh
          sedi "s/^version: \".*\"$/version: \"${VERSION}\"/" build/linux/nfpm/nfpm.yaml

          grep -q "var Version = \"${VERSION}\"" main.go
          grep -q "\"${VERSION}\"" build/config.yml
          grep -q "<string>${VERSION}</string>" build/darwin/Info.plist
          grep -q "\"${VERSION}\"" build/windows/info.json
          grep -q "\"${VERSION}\"" build/windows/nsis/wails_tools.nsh
          grep -q "\"${VERSION}\"" build/linux/nfpm/nfpm.yaml

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          wails3 task darwin:package:universal
          mkdir -p dist
          ditto -c -k --keepParent "bin/wails-v3-demo.app" "dist/wails-v3-demo-darwin-arm64-amd64.zip"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          wails3 task windows:package INSTALL_SCOPE=user
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "bin/wails-v3-demo-amd64-installer.exe" "dist/"
          Compress-Archive -Path "bin/wails-v3-demo.exe" -DestinationPath "dist/wails-v3-demo-windows-amd64.zip" -Force

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          wails3 task linux:package
          mkdir -p dist
          tar -czf "dist/wails-v3-demo-linux-amd64.tar.gz" -C bin wails-v3-demo
          cp bin/*.AppImage dist/ 2>/dev/null || true
          cp bin/*.deb dist/ 2>/dev/null || true
          cp bin/*.rpm dist/ 2>/dev/null || true
          cp bin/*.pkg.tar.zst dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-dist
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name 'checksums.txt' -printf '%f\n' \
            | sort \
            | xargs sha256sum > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
