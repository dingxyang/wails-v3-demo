name: Release

# Push a tag like v0.1.0 to build macOS packages and publish a GitHub Release.
# The release asset is named so the built-in Wails updater can find it:
#   - wails-v3-demo-darwin-arm64-amd64.zip   (universal .app)
# Optional release notes: add .github/release-notes/<tag>.md (e.g. v0.1.1.md).
# Without it, GitHub generates the notes from commits.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v3.0.0-alpha2.108

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-14
            artifact: darwin
    steps:
      - uses: actions/checkout@v4

      - name: Verify build assets are committed
        shell: bash
        run: |
          if [ ! -f build/Taskfile.yml ]; then
            echo "::error::build/ is missing. Commit the Wails build assets before tagging."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tags must look like v1.2.3 (got ${GITHUB_REF_NAME})"
            exit 1
          fi

          sedi() {
            if sed --version >/dev/null 2>&1; then
              sed -i -E "$@"
            else
              sed -i '' -E "$@"
            fi
          }

          sedi "s/^var Version = \".*\"$/var Version = \"${VERSION}\"/" main.go
          sedi "s/^(  version: )\"[^\"]*\"/\1\"${VERSION}\"/" build/config.yml
          sedi "/<key>CFBundleVersion<\/key>/{n;s#<string>[^<]*</string>#<string>${VERSION}</string>#;}" build/darwin/Info.plist
          sedi "/<key>CFBundleShortVersionString<\/key>/{n;s#<string>[^<]*</string>#<string>${VERSION}</string>#;}" build/darwin/Info.plist

          grep -q "var Version = \"${VERSION}\"" main.go
          grep -q "\"${VERSION}\"" build/config.yml
          grep -q "<string>${VERSION}</string>" build/darwin/Info.plist

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          wails3 task darwin:package:universal
          mkdir -p dist
          ditto -c -k --keepParent "bin/wails-v3-demo.app" "dist/wails-v3-demo-darwin-arm64-amd64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-dist
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name 'checksums.txt' -printf '%f\n' \
            | sort \
            | xargs sha256sum > checksums.txt
          cat checksums.txt

      - name: Collect release notes
        id: notes
        shell: bash
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            echo "body_path=$notes" >> "$GITHUB_OUTPUT"
          else
            echo "No ${notes}; GitHub will generate release notes from commits."
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: true
